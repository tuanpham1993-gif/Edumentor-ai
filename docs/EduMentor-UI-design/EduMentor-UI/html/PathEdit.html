<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<title>Thêm kỹ năng và kết nối</title>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap"><style>
body{margin:0;background:#100e0c}
a{color:#f5a524;text-decoration:none}a:hover{color:#ffc35c}
input::placeholder{color:#8f897f}
</style></head>
<body>


<div style="min-height: 900px; position: relative; overflow: hidden; background: #100e0c; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #f3efe8">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 32px; padding: 16px 40px; border-bottom: 1px solid #221f1c; background: #121110">
<span style="display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px"><svg aria-hidden="true" width="32" height="32" viewBox="0 0 32 32"><path d="M16 3 29 10.5v11L16 29 3 21.5v-11z" fill="none" stroke="#f5a524" stroke-width="2.4"></path><path d="M8 14l8-4 8 4-8 4z" fill="#f5a524"></path><path d="M11 16v4c0 1.5 2.2 3 5 3s5-1.5 5-3v-4" fill="none" stroke="#f5a524" stroke-width="2"></path></svg>EduMentor AI</span>
<span style="flex: 1; display: flex; flex-wrap: wrap; gap: 6px 24px; font-size: 14px; color: #c9c2b7"><span>Khóa học</span><span style="color: #f5a524">Lộ trình</span><span>Khóa học của tôi</span><span>Ôn tập</span><span>AI Tutor</span></span>
<span style="width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #3a4150; font-size: 13px; font-weight: 700; border: 2px solid #f5a524">NA</span>
</header>
<div aria-hidden="true" style="max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 32px 24px; display: flex; flex-wrap: wrap; gap: 20px">
<div style="flex: 999 1 640px; height: 520px; border-radius: 18px; background: #16171a; border: 1px solid #2c2b29"></div>
<div style="flex: 1 1 360px; height: 600px; border-radius: 18px; background: #16171a; border: 1px solid #2c2b29"></div>
</div>
<div style="position: absolute; inset: 0; background: rgba(6,5,4,0.78)"></div>
<div aria-hidden="true" style="position: absolute; left: calc(50% - 520px); top: 200px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(245,165,36,0.28), rgba(245,165,36,0) 65%)"></div>
<svg aria-hidden="true" width="120" height="450" viewBox="0 0 120 450" style="position: absolute; left: calc(50% - 370px); top: 0"><line x1="60" y1="0" x2="60" y2="340" stroke="#2b2622" stroke-width="3"></line><path d="M32 340h56l20 50H12z" fill="#1b1a19" stroke="#3a342d"></path><ellipse cx="60" cy="390" rx="48" ry="7" fill="#ffb347"></ellipse><circle cx="60" cy="397" r="11" fill="#ffd27a"></circle><line x1="82" y1="390" x2="82" y2="442" stroke="#6b5a40"></line><circle cx="82" cy="446" r="4" fill="#f5a524"></circle></svg>
<div role="dialog" aria-modal="true" aria-labelledby="pe-title" style="position: absolute; left: 50%; top: 100px; transform: translateX(-50%); width: calc(100% - 48px); max-width: 560px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 20px; background: #16171a; border: 1px solid #2c2b29; border-radius: 20px; box-shadow: 0 40px 80px rgba(0,0,0,0.6)">
<div style="display: flex; justify-content: space-between; align-items: center"><h1 id="pe-title" style="margin: 0; font-size: 22px; font-weight: 700">Thêm kỹ năng vào lộ trình</h1><a href="PathDetail.html" aria-label="Đóng" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: #c9c2b7; font-size: 20px">×</a></div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #d6d0c6">Kỹ năng
<span style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; background: #1f2024; border: 1px solid #33322f; border-radius: 10px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a39d93" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input type="search" value="NumPy" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #f3efe8; font: inherit; font-size: 14px"></span>
<span style="font-size: 12px; color: #a39d93">Mỗi kỹ năng chỉ xuất hiện một lần trong lộ trình.</span>
</label>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #d6d0c6">Vai trò
<select style="height: 46px; padding: 0 12px; background: #1f2024; border: 1px solid #33322f; border-radius: 10px; color: #f3efe8; font: inherit; font-size: 14px"><option>Tiên quyết</option><option>Tùy chọn</option><option>Mở rộng</option><option>Không xác định</option></select></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #d6d0c6">Thứ tự hiển thị
<input type="number" value="4" style="height: 46px; padding: 0 12px; background: #1f2024; border: 1px solid #33322f; border-radius: 10px; color: #f3efe8; font: inherit; font-size: 14px"></label>
</div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #d6d0c6"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #f5a524">Đánh dấu là kỹ năng mục tiêu</label>
<div style="height: 1px; background: #2c2b29"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><h2 style="margin: 0; font-size: 16px; font-weight: 600">Kết nối với kỹ năng khác</h2><span style="font-size: 13px; color: #a39d93">Cả hai đầu phải là kỹ năng đã có trong lộ trình.</span></div>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
<label style="flex: 1 1 140px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #d6d0c6">Từ
<select style="height: 46px; padding: 0 12px; background: #1f2024; border: 1px solid #33322f; border-radius: 10px; color: #f3efe8; font: inherit; font-size: 14px"><option>Python</option><option>SQL</option></select></label>
<span aria-hidden="true" style="height: 46px; display: flex; align-items: center; color: #f5a524; font-size: 18px">→</span>
<label style="flex: 1 1 140px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #d6d0c6">Đến
<select style="height: 46px; padding: 0 12px; background: #1f2024; border: 1px solid #33322f; border-radius: 10px; color: #f3efe8; font: inherit; font-size: 14px"><option>NumPy (mới)</option><option>Pandas</option></select></label>
<label style="flex: 1 1 160px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #d6d0c6">Loại quan hệ
<select style="height: 46px; padding: 0 12px; background: #1f2024; border: 1px solid #33322f; border-radius: 10px; color: #f3efe8; font: inherit; font-size: 14px"><option>Tiên quyết</option><option>[Loại khác theo schema]</option></select></label>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; padding-top: 4px">
<a href="PathDetail.html" style="height: 48px; padding: 0 22px; display: flex; align-items: center; border-radius: 10px; border: 1px solid #3a3835; color: #f3efe8; font-size: 15px; font-weight: 600">Hủy</a>
<a href="PathDetail.html" style="height: 48px; padding: 0 22px; display: flex; align-items: center; border-radius: 10px; background: #f5a524; color: #1a1206; font-size: 15px; font-weight: 600">Thêm vào lộ trình</a>
</div>
</div>
</div>




</body></html>
