
services:
  postgres:
    image: postgres:16-alpine
    container_name: edumentor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edumentor
      POSTGRES_PASSWORD: edumentor123
      POSTGRES_DB: edumentor_db
    ports:
      - "5433:5432"
    volumes:
      - edumentor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumentor -d edumentor_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: edumentor_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  llama-base:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: edumentor_llm_base
    ports:
      - "8082:8080" # máy chủ 8080 hay bị chiếm (vd MiniTool ShadowMaker) → dùng 8082
    volumes:
      - ./backend/app/ai/models:/models:ro
    command:
      - "-m"
      - "/models/qwen3-1.7b-q4_k_m.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "2048"
      - "--threads"
      - "4"
      - "--jinja"
    restart: unless-stopped

  llama-adapter:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: edumentor_llm_adapter
    ports:
      - "8081:8080"
    volumes:
      - ./backend/app/ai/models:/models:ro
    command:
      - "-m"
      - "/models/qwen3-1.7b-q4_k_m.gguf"
      - "--lora"
      - "/models/edumentor-qwen3-skill-extraction-f16.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "2048"
      - "--threads"
      - "4"
      - "--jinja"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: edumentor_qdrant
    restart: unless-stopped
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - edumentor_qdrant_data:/qdrant/storage

  # ─────────── Ứng dụng (Tuấn · 13/11/2026) — chạy cả hệ thống bằng Docker ───────────
  # docker compose up -d --build postgres qdrant backend frontend
  #   Web:     http://localhost:8088      Swagger: http://localhost:8001/api/docs
  # (khác cổng 5173 / 8000 lúc chạy dev trên máy → chạy song song được)
  # Ghi rõ tên dịch vụ: "up -d" trống sẽ bật cả llama-base / llama-adapter (cần file .gguf, repo không có).
  backend:
    build: ./backend
    image: edumentor/backend:dev
    container_name: edumentor_backend
    restart: unless-stopped
    env_file: .env # khóa Gemini, SMTP, SECRET_KEY… (không đưa vào image)
    environment:
      # Trong mạng Docker gọi nhau bằng TÊN dịch vụ + cổng TRONG container (ghi đè giá trị localhost của .env)
      DATABASE_URL: postgresql+psycopg://edumentor:edumentor123@postgres:5432/edumentor_db
      QDRANT_URL: http://qdrant:6333
      LLM_URL_BASE: http://llama-base:8080
      LLM_URL_ADAPTER: http://llama-adapter:8080
      FRONTEND_URL: http://localhost:8088 # link trong email (đặt lại mật khẩu, kết quả ôn tập)
      ALLOWED_ORIGINS: '["http://localhost:8088", "http://localhost:8001"]'
    ports:
      - "8001:8000"
    volumes:
      - ./datajson:/app/datajson:ro # dữ liệu seed của Hòa (code đọc ../datajson)
      - edumentor_uploads:/app/backend/uploads # ảnh đại diện — giữ khi build lại image
      - edumentor_hf_cache:/cache/huggingface # mô hình embedding tải 1 lần
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build: ./frontend
    image: edumentor/frontend:dev
    container_name: edumentor_frontend
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - backend

volumes:
  edumentor_pgdata:
  ollama_data:
  edumentor_qdrant_data:
  edumentor_uploads:
  edumentor_hf_cache:
