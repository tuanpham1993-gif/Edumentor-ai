# Alembic - migration database (Tuan - G2a, 22/11/2026). Dia chi DB lay tu DATABASE_URL trong .env (alembic/env.py),
# KHONG ghi o day. Backend tu chay luc khoi dong (app/core/migrations.py) - thuong khong can go lenh.
# File nay de ASCII (khong dau): Windows doc .ini bang cp1252, chu co dau lam alembic loi.
# Lenh tay (trong thu muc backend):
#   alembic current                         # database dang o ban nao
#   alembic revision --autogenerate -m "..." # tao migration moi tu thay doi model
#   alembic upgrade head                    # nang len ban moi nhat

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
