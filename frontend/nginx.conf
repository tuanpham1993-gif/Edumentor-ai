# nginx cho frontend trong Docker — thay proxy của Vite (vite.config.js) khi chạy bằng container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ảnh đại diện tối đa 5 MB (AVATAR_MAX_BYTES) → cho phép request 6 MB
    client_max_body_size 6m;

    # API → backend (tên dịch vụ trong docker-compose.yaml)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chấm tự luận bằng AI (chờ tới 20s rồi chấm nền) · chatbot / LLM của Hòa có thể tới 180s
        proxy_read_timeout 180s;
    }

    # Ảnh đại diện đã upload
    location /uploads/ {
        proxy_pass http://backend:8000;
    }

    # File build có mã băm trong tên → cache lâu
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: mọi đường dẫn khác trả index.html (vd /courses/312/review, /me/appearance)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
